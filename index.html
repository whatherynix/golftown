<!doctype html>
<html lang="en">
  <head>
    <script>
      // Immediately unregister all service workers and clear cache to avoid loading stale React assets
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (const registration of registrations) {
            registration.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(names => {
          for (const name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golf Town Store Credit Portal Q1 2026</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#004d25" />
    <link rel="icon" href="https://ams-cdn.cashstar.com/permanent/brands/GOLFTOWN/meta/icons/favicon.ico?version=1014" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
